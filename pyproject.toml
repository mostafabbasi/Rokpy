[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rokpy"
dynamic = ["version"]
description = "A comprehensive object-oriented Python package for building rock-physics models."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Mostafa Abbasi", email = "abbasi.mstfa@gmail.com"}
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.3",
    "pandas>=1.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
[tool.setuptools_scm]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=21.0",
    "flake8>=3.9",
    "isort>=5.0" ,
    "build", 
    "twine",
]
docs = [
    "sphinx>=6.2,<7",
    "furo>=2024.4.0",
    "myst-parser>=0.18.0",
    "nbsphinx>=0.9.8",
    "sphinx-rtd-theme>=1.0",
]
notebooks = [
    "jupyter>=1.0",
    "jupyterlab>=3.0",
]

[project.urls]
Homepage = "https://github.com/abbasi-mst/rokpy"
Repository = "https://github.com/abbasi-mst/rokpy"
"Bug Tracker" = "https://github.com/abbasi-mst/rokpy/issues"
Documentation = "https://github.com/abbasi-mst/rokpy"

[tool.setuptools.packages]
find = {where = ["."], include = ["rokpy*"]}

# Code formatting and linting tools
[tool.black]
line-length = 150
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [".venv/**", "build/**", "dist/**"]

[tool.flake8]
max-line-length = 100
exclude = [".venv", "build", "dist", ".git", "__pycache__", "*.egg-info"]
ignore = ["E203", "W503"]

# Testing
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

# Type checking
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true